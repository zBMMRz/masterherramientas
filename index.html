<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js">
</script>

</head>

<body style="margin:0; background:#222;">

<model-viewer
src="disco3d.glb"
ar
camera-controls
auto-rotate
shadow-intensity="1"
exposure="1"
environment-image="neutral"
camera-orbit="0deg 75deg 2m"
field-of-view="30deg"
style="width:100vw; height:100vh;">
</model-viewer>

</body>
</html>
